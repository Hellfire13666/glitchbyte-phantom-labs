name: Attach Named Phantom Tool Artwork

on:
  push:
    branches: [main]
    paths:
      - "artwork/tool-covers/**"
      - "docs/TOOL_COVER_MAP.json"
      - "scripts/link_tool_covers.py"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: phantom-tool-artwork
  cancel-in-progress: false

jobs:
  attach:
    name: Connect uploaded covers to their matching tool pages
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout the workshop
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Connect only real, present PNG artwork
        run: python3 scripts/link_tool_covers.py
      - name: Publish safe documentation updates
        run: |
          git config user.name "phantom-labs-artwork-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/tool-showcases/
          if git diff --cached --quiet; then
            echo "No uploaded artwork needs linking."
          else
            git commit -m "artwork: link selected tool covers to showcases [skip ci]"
            git push origin HEAD:main
          fi
