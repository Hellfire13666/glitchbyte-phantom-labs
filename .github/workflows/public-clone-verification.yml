name: Public GitHub clone and offline release check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  public-clone:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout proposed revision for source comparison
        uses: actions/checkout@v4

      - name: Configure Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Configure Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Clone the public repository over HTTPS
        shell: bash
        run: |
          set -euo pipefail
          echo "Public HTTPS clone: no Git URL rewrite and no stored token."
          git -c credential.helper= clone --depth 1 \
            https://github.com/Hellfire13666/glitchbyte-phantom-labs.git \
            "$RUNNER_TEMP/phantom-public-clone"
          test -f "$RUNNER_TEMP/phantom-public-clone/README.md"
          test -f "$RUNNER_TEMP/phantom-public-clone/LICENSE-NOTICE.md"
          test -f "$RUNNER_TEMP/phantom-public-clone/SECURITY.md"
          git -C "$RUNNER_TEMP/phantom-public-clone" remote -v
          echo "PASS: public repository cloned from GitHub HTTPS"

      - name: Inventory source changes against public main
        shell: bash
        run: |
          set -euo pipefail
          SOURCE="$GITHUB_WORKSPACE"
          CLONE="$RUNNER_TEMP/phantom-public-clone"
          # Pull requests may legitimately fix tools. Report differences rather
          # than fail because the public default branch has older source.
          python3 - "$SOURCE" "$CLONE" <<'PY'
          import hashlib
          import pathlib
          import sys

          source, baseline = [pathlib.Path(x) for x in sys.argv[1:]]
          def inventory(root):
              return {
                  str(p.relative_to(root)): hashlib.sha256(p.read_bytes()).hexdigest()
                  for p in (root / "tools").rglob("*")
                  if p.is_file() and (p.suffix in {".py", ".go"} or p.name == "go.mod")
              }

          proposed = inventory(source)
          public = inventory(baseline)
          assert proposed and public, "No tool sources found"
          for name in sorted(set(proposed) | set(public)):
              if proposed.get(name) != public.get(name):
                  print("CHANGED relative to public main:", name)
          print("PASS: both source inventories readable; changes may be intentional")
          PY

      - name: Run offline Python smoke tests from the public clone
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/phantom-public-clone"
          python3 -m unittest discover -s tests -p 'test_offline_terminal_verification.py' -v

      - name: Run Go test and build from the public clone
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/phantom-public-clone/tools/go/voidlantern-go"
          go test ./...
          go vet ./...
          go build -o "$RUNNER_TEMP/voidlantern" .
          test -x "$RUNNER_TEMP/voidlantern"
          echo "PASS: VOIDLANTERN built from HTTPS-cloned repository"
